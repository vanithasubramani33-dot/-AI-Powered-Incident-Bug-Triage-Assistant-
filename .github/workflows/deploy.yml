name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: incident-triage-assistant/frontend/package-lock.json

      - name: Install
        working-directory: incident-triage-assistant/frontend
        run: npm ci

      - name: Build
        working-directory: incident-triage-assistant/frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: incident-triage-assistant/frontend/build

      - name: Deploy
        uses: actions/deploy-pages@v4
